<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ ui.not_found_title | t }} | {{ site.name }}</title>
  {# Absolute paths: 404.html can be served from any URL depth. #}
  {% set base = site.site_url %}
  <link rel="icon" href="{{ base }}static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ base }}static/css/site.css">
</head>
<body>
  <main id="main" class="container notfound">
    <p class="eyebrow">404</p>
    <h1 class="hero__title">{{ ui.not_found_title | t }}</h1>
    <p class="hero__lead">{{ ui.not_found_body | t }}</p>
    <p><a class="btn btn--primary" href="{{ base }}">{{ ui.not_found_cta | t }}</a></p>
  </main>
</body>
</html>
